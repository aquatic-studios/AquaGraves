  grave-too-far: "%prefix%&#FFA42D[Warning] You are too far from that grave"
  grave-deposit-denied: "%prefix%&#FFA42D[Warning] You can't put items into a grave"
  xp-restored: "%prefix%You recovered &#56FF00%xp% &fxp"

